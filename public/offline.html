<!doctype html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>You are offline</title>
    <meta name="description" content="Internet connection appears to be offline. Please try again later.">

    <!-- Favicons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png">

    <!-- Favicon for dark mode -->
    <link rel="icon" href="/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">

    <!-- Touch Icons for iOS -->
    <link rel="apple-touch-icon" href="/icon/apple-touch-icon.png">

    <!-- Theme Colors (Dynamic Light/Dark) -->
    <meta name="theme-color" content="#f05e0e" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

    <link rel="stylesheet" href="/assets/offline.css">

  </head>

  <body>
    <main class="errorPage">
      <div>
        <span>📡</span>
        <h1>You are offline</h1>
          <p>No Internet connection detected.</p>
          <p>Please check your network and try reloading the page.</p>
      </div>
      <button onclick="location.reload()">Reload</button>
    </main>
  </body>

</html>
